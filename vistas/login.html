<div id="loginOverlay" class="login-overlay">
  <div class="login-overlay-inner" id="loginOverlayInner">

    <div class="login-brand-card" id="loginBrandCard">
      <img src="LOGO_IGLEISA.png" alt="Logo C.C.R.M" class="login-logo" id="loginLogo" />
      <div class="login-brand-text">Reporte de métricas C.C.R.M</div>
    </div>

    <button type="button" class="login-btn-start" id="btnIniciarSesion">
      <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
    </button>

    <div class="login-name-step" id="loginNameStep">
      <label for="loginNameInput" class="login-name-label">Ingresa tu nombre</label>
      <input type="text" id="loginNameInput" class="login-name-input"
             placeholder="Ej. Juan Pérez" autocomplete="off" maxlength="60" />
      <div class="login-name-error d-none" id="loginNameError">Por favor ingresa tu nombre.</div>
      <button type="button" class="login-btn-confirm" id="btnConfirmarNombre">
        <i class="bi bi-check-lg me-2"></i>Ingresar
      </button>
    </div>

  </div>
</div>
